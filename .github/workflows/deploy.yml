name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run lint

      - name: Run unit tests
        run: npx tsx --test src/logic/elementLogic.test.ts src/logic/electronConfigCalculator.test.ts

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$RAW_BASE" ] || [ "$RAW_BASE" = "/" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="${RAW_BASE%/}/"
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
